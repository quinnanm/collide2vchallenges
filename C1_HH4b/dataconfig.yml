# C1: HH -> 4b challenge dataset config.
# See preprocessing/docs/challenge_dataconfig.md for the full key reference.
#
# Sizing: re-estimated 2026-08-27 against the real EOS directories, for the
# CURRENT sample composition below -- see C1_HH4b/size_estimate.txt.
# Total: 130.56 GB (117.50 GB train / 13.06 GB eval), under the ~200GB/
# challenge budget. QCD_HT250toInf confirmed to exist on EOS in this run
# (500/500 files version-matched) -- resolves the earlier open question
# about that sample name.
ds_name: C1_HH4b

data_processing:
  sample_dir: /eos/project/f/foundational-model-dataset/samples/production_final
  redir: "root://eosproject-f.cern.ch/"
  out_path: "/mnt/hackathon-data/C1_HH4b"   # hackathon-data PVC mount, see fastmlhackathon/nrp/pvc.yaml
  dataset_version: collide2v_v1.0

  # per-sample event selection, target events, and labeling. The label is
  # used for the supervised classification task (0=background, 1=signal).
  samples:
    - name: QCD_HT250toInf
      label: 0                 # background
      target_events: 1000000
    - name: HH_4b
      label: 1                 # signal
      target_events: 10000000
    - name: WJetsToLNu_13TeV-madgraphMLM-pythia8
      label: 3                
      target_events: 2000000
    - name: WJetsToQQ_13TeV-madgraphMLM-pythia8
      label: 3                 
      target_events: 2000000
    - name: tt0123j_5f_ckm_LO_MLM_hadronic
      label: 2                 
      target_events: 2000000
    - name: tt0123j_5f_ckm_LO_MLM_semiLeptonic
      label: 2
      target_events: 2000000
    - name: tt0123j_5f_ckm_LO_MLM_leptonic
      label: 2
      target_events: 2000000

  #per collection caps, object selection, and field drops. These are applied
  #after the per-sample event selection above
  collections:
    L1T_PUPPIPart:
      cap: 18                # candidates kept PER REGION 
      total_cap: 500          # secondary ceiling on the flattened per-event total after region selection
      drop_fields: [is_pu, is_reco_pu]   # exclude gen-level (MC-truth) variables
    L1T_Electron:
      cap: 5                 # observed max
    L1T_JetAK4:
      cap: 25                # observed max
      drop_fields: [Flavor]   # generator-level parton flavor -- exclude gen-level variables
    L1T_JetAK8:
      cap: 5                 # observed max
      drop_fields: [Flavor]
    L1T_MuonTight:
      cap: 5                 # observed max
    L1T_PhotonTight:
      cap: 3                 # observed max
    L1T_JetPuppiAK4:
      cap: 10                # observed max
      drop_fields: [Flavor]   # generator-level parton flavor -- exclude gen-level variables
    L1T_JetPuppiAK8:
      cap: 5                 # observed max
      drop_fields: [Flavor]  # generator-level parton flavor -- exclude gen-level variables
    L1T_MET: 1
    L1T_PUPPIMET: 1
    L1T_ScalarHT: 1
    Event:                  # per-event MC generation metadata -- keep only weight/cross section
      drop_fields: [Number, ProcessID, CrossSectionError, Scale, AlphaQCD, AlphaQED, ID1, ID2, X1, X2, PDF1, PDF2, ScalePDF]

  # region-geometry candidate selection, as requested ("geometry selection").
  # pt: raw + floor_gev: 1.0 together ARE the "raw pt>1"
  # realistic_pid: true is the "standard non-gen PID selection"
  # (the sanitized 5-bucket scheme, not raw/truth-adjacent PID).
  candidate_selection:
    mode: region
    pt: raw
    floor_gev: 1.0
    realistic_pid: true

  split:
    train_frac: 0.9
    eval_frac: 0.1
    seed: 42

  # 200,000, not 2,000,000: QCD_HT250toInf's 1M-event target never hit the
  # old 2M threshold, so its ENTIRE output sat buffered in memory for the
  # whole sample (500-candidate/event cap x ~13 fields x a dozen other
  # collections) -- real conversion OOMed at 32Gi right as HH_4b's much
  # larger 10M target started piling more onto that. This keeps any single
  # buffered chunk well under a few GB regardless of a sample's target_events.
  #
  # Lowered further, 200000 -> 25000: even with the malloc_trim fix in
  # converters.py's _flush_buffer (real RSS growth from allocator
  # fragmentation, not a Python reference leak -- see that function's
  # comment), HH_4b (10M target, a dense multi-jet signal that saturates
  # the 500-candidate cap far more than QCD/minbias) still OOMed at 64Gi
  # after ~100 min -- a same-fix C9 run over the same window grew far more
  # slowly (~0.23 GB/min) and didn't crash, pointing at per-event candidate
  # density (allocation size/count per flush cycle), not a totally broken
  # fix. Flushing 8x more often keeps each buffer -- and each fragmentation
  # -inducing alloc/free cycle -- smaller for this specific sample.
  flush_every_events: 25000
  report_diagnostics: false
