# C1: HH -> 4b challenge dataset config.
# See preprocessing/docs/challenge_dataconfig.md for the full key reference.
#
# Sizing: last re-estimated 2026-08-26 against the real EOS directories, for
# the PREVIOUS sample composition (QCD 20M/HH_4b 20M/WJetsToLNu 10M/TT 10M
# split 46:44:10) -- see C1_HH4b/size_estimate.txt. Sample list changed since
# then (HH_4b now uncapped, WJetsToLNu/WJetsToQQ/TT all much smaller) --
# re-run estimate_output_size.py for a current number before relying on it.
ds_name: C1_HH4b

data_processing:
  sample_dir: /eos/project/f/foundational-model-dataset/samples/production_final
  redir: "root://eosproject-f.cern.ch/"
  out_path: "/mnt/collide2vchallenges/C1_HH4b"   # collide2vchallenges PVC mount, see fastmlhackathon/nrp/pvc.yaml
  dataset_version: collide2v_v1.0

  # per-sample event selection, target events, and labeling. The label is
  # used for the supervised classification task (0=background, 1=signal).
  samples:
    - name: QCD_HT50toInf
      label: 0                 # background (matches regionize.SAMPLE_LABELS' existing QCD=0)
      target_events: 20000000
      event_selection:
        - {collection: L1T_ScalarHT, field: HT, op: '>', value: 240} #HT>240 cut
    - name: HH_4b
      label: 1                 # signal
      # No target_events: takes every available file (the true max), rather
      # than a hardcoded guess -- docs/eos_dataset_schema.md's ~2.10M figure
      # already turned out stale once (real measurement 2026-08-26: ~2,000
      # files, ~19.99M achievable), and getting an exact current count would
      # mean fully reading all ~2,000 files (~1 min/file observed during
      # sizing -- ~33 hours), not worth it just to hardcode a number that'll
      # go stale again anyway.
    - name: WJetsToLNu_13TeV-madgraphMLM-pythia8
      label: 3                 # background (matches regionize.SAMPLE_LABELS' existing WJETS=3)
      target_events: 30000
    - name: WJetsToQQ_13TeV-madgraphMLM-pythia8
      label: 4                 # background -- distinct W+jets decay channel, own label (not merged with WJetsToLNu)
      target_events: 70000
    # TT split 50k/40k/10k hadronic:semiLeptonic:leptonic (absolute counts,
    # not a branching-ratio proportion this time).
    - name: tt0123j_5f_ckm_LO_MLM_hadronic
      label: 2                 # background (matches regionize.SAMPLE_LABELS' existing TT=2)
      target_events: 50000
    - name: tt0123j_5f_ckm_LO_MLM_semiLeptonic
      label: 2
      target_events: 40000
    - name: tt0123j_5f_ckm_LO_MLM_leptonic
      label: 2
      target_events: 10000

  #per collection caps, object selection, and field drops. These are applied
  #after the per-sample event selection above
  collections:
    L1T_PUPPIPart:
      cap: 18                # candidates kept PER REGION 
      total_cap: 500          # secondary ceiling on the flattened per-event total after region selection
      drop_fields: [is_pu, is_reco_pu]   # exclude gen-level (MC-truth) variables
    L1T_Electron:
      cap: 5                 # observed max
      object_selection:
        - {field: PT, op: '>', value: 1}
    L1T_JetAK4:
      cap: 25                # observed max
      object_selection:
        - {field: PT, op: '>', value: 1}
      drop_fields: [Flavor]   # generator-level parton flavor -- exclude gen-level variables
    L1T_JetAK8:
      cap: 5                 # observed max
      object_selection:
        - {field: PT, op: '>', value: 1}
      drop_fields: [Flavor]
    L1T_MuonTight:
      cap: 5                 # observed max
      object_selection:
        - {field: PT, op: '>', value: 1}
    L1T_PhotonTight:
      cap: 3                 # observed max
      object_selection:
        - {field: PT, op: '>', value: 1}
    L1T_JetPuppiAK4:
      cap: 10                # observed max
      object_selection:
        - {field: PT, op: '>', value: 1}
      drop_fields: [Flavor]   # generator-level parton flavor -- exclude gen-level variables
    L1T_JetPuppiAK8:
      cap: 5                 # observed max
      object_selection:
        - {field: PT, op: '>', value: 1}
      drop_fields: [Flavor]  # generator-level parton flavor -- exclude gen-level variables
    L1T_MET: 1
    L1T_PUPPIMET: 1
    L1T_ScalarHT: 1

  # region-geometry candidate selection, as requested ("geometry selection").
  # pt: raw + floor_gev: 1.0 together ARE the "raw pt>1" requirement for
  # L1T_PUPPIPart (this collection's own built-in floor mechanism -- no
  # separate object_selection needed/added on top of it, to avoid a
  # redundant/inconsistent second pT cut with a different boundary
  # convention). realistic_pid: true is the "standard non-gen PID selection"
  # (the sanitized 5-bucket scheme, not raw/truth-adjacent PID).
  candidate_selection:
    mode: region
    pt: raw
    floor_gev: 1.0
    realistic_pid: true

  split:
    train_frac: 0.9
    eval_frac: 0.1
    seed: 42

  flush_every_events: 2000000
  report_diagnostics: false
