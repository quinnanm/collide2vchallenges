# Kubernetes Job: runs preprocessing/candidate_selection_study.py against
# EVERY process directory in the source EOS dataset (not scoped to any one
# challenge), 1 real file/process, comparing puppi-weighted-pT vs raw-pT
# candidate selection (region geometry, cap=18/region, |eta|<=3, 1 GeV
# floor). See preprocess-c1-hh4b.yaml's comments for background on the
# CVMFS/grid-cert/xrootd setup below.
apiVersion: batch/v1
kind: Job
metadata:
  name: candidate-selection-study
  namespace: fastml26-hackathon
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 21600   # 6h -- one file/process should be much faster than a real conversion,
                                  # but the process count (every EOS dir, not one challenge's list) is unknown upfront
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: study
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="

              if [ -d /cvmfs/grid.cern.ch/etc/grid-security/certificates ]; then
                export X509_CERT_DIR=/cvmfs/grid.cern.ch/etc/grid-security/certificates
                export X509_VOMS_DIR=/cvmfs/grid.cern.ch/etc/grid-security/vomsdir
                export VOMS_USERCONF=/cvmfs/grid.cern.ch/etc/grid-security/vomses
              elif [ -d /cvmfs/oasis.opensciencegrid.org/mis/certificates ]; then
                export X509_CERT_DIR=/cvmfs/oasis.opensciencegrid.org/mis/certificates
                export X509_VOMS_DIR=/cvmfs/oasis.opensciencegrid.org/mis/vodata/grid-security/vomsdir
                export VOMS_USERCONF=/cvmfs/oasis.opensciencegrid.org/mis/vodata/vomses
              else
                echo "FATAL: no CVMFS grid repo found" >&2
                exit 1
              fi
              export XRD_NETWORKSTACK=IPv4

              apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
              rm -rf /var/lib/apt/lists/*

              git clone --depth 1 https://github.com/quinnanm/collide2vchallenges /tmp/collide2vchallenges
              cd /tmp/collide2vchallenges/preprocessing
              pip install --quiet -r requirements.txt

              echo "=== Starting study: $(date) ==="
              python -u candidate_selection_study.py \
                --report-path candidate_selection_study.txt \
                --npz-path candidate_selection_study.npz

              mkdir -p /mnt/hackathon-data/studies
              cp candidate_selection_study.txt candidate_selection_study.npz /mnt/hackathon-data/studies/
              echo "=== Report copied to PVC ==="
              cat candidate_selection_study.txt
              echo "=== Job finished: $(date) ==="

          env:
            - name: X509_USER_PROXY
              value: /etc/grid-security-ro/x509up

          resources:
            # Modest -- reads exactly 1 file/process (not accumulating
            # across many files like a real conversion), never more than
            # one process's worth of raw candidate data in memory at once.
            requests: {memory: "8Gi", cpu: "2"}
            limits: {memory: "8Gi", cpu: "2"}

          volumeMounts:
            - name: output-volume
              mountPath: /mnt/hackathon-data
            - name: x509-proxy
              mountPath: /etc/grid-security-ro
              readOnly: true
            - name: cvmfs
              mountPath: /cvmfs
              mountPropagation: HostToContainer

      volumes:
        - name: output-volume
          persistentVolumeClaim:
            claimName: hackathon-data
        - name: x509-proxy
          secret:
            secretName: x509-proxy-mquinnan-ucsd-edu
            defaultMode: 0400
        - name: cvmfs
          persistentVolumeClaim:
            claimName: cvmfs
