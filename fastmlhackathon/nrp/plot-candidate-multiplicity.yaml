# Kubernetes Job: runs preprocessing/plot_candidate_multiplicity.py against
# the raw candidates produced by preprocess-raw-candidates-ttbar-
# semileptonic.yaml. No CVMFS/grid-cert needed (data already lives on
# temp-data, no EOS access required) -- just mounts temp-data read-write
# (write for the output PNG) and pip installs the plotting deps. No GPU.
#
# Bare Pods are capped at 32GB RAM by an NRP admission webhook (hit this
# directly: "PODs without controllers are limited to 16 cores and 32 GB of
# RAM") -- a Job's pod has a controller (the Job itself) and isn't subject
# to that cap, which is why this is a Job and not just a Pod even though no
# EOS/grid access is needed here.
apiVersion: batch/v1
kind: Job
metadata:
  name: plot-candidate-multiplicity
  namespace: fastml26-hackathon
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800   # 30m -- just reading ~19.5k already-preprocessed events + one plot
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: plotter
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="

              apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
              rm -rf /var/lib/apt/lists/*

              git clone --depth 1 https://github.com/quinnanm/collide2vchallenges /tmp/collide2vchallenges
              cd /tmp/collide2vchallenges/preprocessing
              pip install --quiet awkward pyarrow matplotlib numpy

              echo "=== Plotting: $(date) ==="
              python -u plot_candidate_multiplicity.py \
                --data-dir /mnt/temp-data/raw_candidates_ttbar_semileptonic/tt0123j_5f_ckm_LO_MLM_semiLeptonic \
                --out-path /mnt/temp-data/raw_candidates_ttbar_semileptonic/candidate_multiplicity_ttbar_semileptonic.png \
                --log-x

              echo "=== Job finished: $(date) ==="

          resources:
            # 64Gi -- a bare-pod attempt at 24Gi OOMKilled loading both
            # fragments (~19.5k events, FullReco uncapped at up to ~8150
            # candidates/event) + concatenating them.
            requests: {memory: "64Gi", cpu: "2"}
            limits: {memory: "64Gi", cpu: "2"}

          volumeMounts:
            - name: output-volume
              mountPath: /mnt/temp-data

      volumes:
        - name: output-volume
          persistentVolumeClaim:
            claimName: temp-data
