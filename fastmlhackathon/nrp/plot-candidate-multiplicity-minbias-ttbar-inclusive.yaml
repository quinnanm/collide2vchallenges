# Kubernetes Job: runs preprocessing/plot_candidate_multiplicity.py against
# the raw candidates produced by preprocess-raw-candidates-minbias.yaml and
# preprocess-raw-candidates-ttbar-inclusive.yaml. No CVMFS/grid-cert needed
# (data already on temp-data). Produces 4 PNGs total (linear-x + log-x for
# each of the two datasets) in one pod, sequentially, to avoid double
# pod-spinup/data-reload cost. No GPU.
#
# ttbar-inclusive mixes the three final states in exact branching-ratio
# proportions via --max-events (4570 hadronic / 4380 semiLeptonic / 1050
# leptonic = 45.70% / 43.80% / 10.50%, matching W->hadronic 67.6% /
# W->leptonic 32.4%) -- see raw_candidates_ttbar_inclusive.yaml's comment
# for the derivation. Preprocessing itself could only hit whole-file
# granularity (~9800+ events/sub-sample, overshooting each small target),
# so the exact mixture is enforced here at load time, not at preprocessing
# time.
#
# Bare Pods are capped at 32GB RAM by an NRP admission webhook -- this is a
# Job (has a controller), not subject to that cap. 64Gi based on the
# ttbar-semileptonic run's real peak (~19.5k events, FullReco uncapped up to
# ~8150 cands/event); this job's peak per-sample fragment size is similar
# order of magnitude (each ttbar sub-sample fragment is ~9800 events before
# slicing down to its BR-weighted count).
apiVersion: batch/v1
kind: Job
metadata:
  name: plot-candidate-multiplicity-minbias-ttbar-inclusive
  namespace: fastml26-hackathon
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: plotter
          image: python:3.11-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="

              apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
              rm -rf /var/lib/apt/lists/*

              git clone --depth 1 https://github.com/quinnanm/collide2vchallenges /tmp/collide2vchallenges
              cd /tmp/collide2vchallenges/preprocessing
              pip install --quiet awkward pyarrow matplotlib numpy

              echo "=== Plotting minbias: $(date) ==="
              python -u plot_candidate_multiplicity.py \
                --data-dir /mnt/temp-data/raw_candidates_minbias/minbias \
                --max-events 10000 \
                --out-path-prefix /mnt/temp-data/raw_candidates_minbias/candidate_multiplicity_minbias \
                --title "minbias (10k events): candidate multiplicity (raw, no selection applied)"

              echo "=== Plotting inclusive ttbar (BR-weighted): $(date) ==="
              python -u plot_candidate_multiplicity.py \
                --data-dir \
                  /mnt/temp-data/raw_candidates_ttbar_inclusive/tt0123j_5f_ckm_LO_MLM_hadronic \
                  /mnt/temp-data/raw_candidates_ttbar_inclusive/tt0123j_5f_ckm_LO_MLM_semiLeptonic \
                  /mnt/temp-data/raw_candidates_ttbar_inclusive/tt0123j_5f_ckm_LO_MLM_leptonic \
                --max-events 4570 4380 1050 \
                --out-path-prefix /mnt/temp-data/raw_candidates_ttbar_inclusive/candidate_multiplicity_ttbar_inclusive \
                --title "inclusive ttbar (10k events, BR-weighted 45.7% had / 43.8% semilep / 10.5% lep): candidate multiplicity (raw, no selection applied)"

              echo "=== Output PNGs: ==="
              find /mnt/temp-data/raw_candidates_minbias /mnt/temp-data/raw_candidates_ttbar_inclusive -name "*.png"

              echo "=== Job finished: $(date) ==="

          resources:
            requests: {memory: "64Gi", cpu: "2"}
            limits: {memory: "64Gi", cpu: "2"}

          volumeMounts:
            - name: output-volume
              mountPath: /mnt/temp-data

      volumes:
        - name: output-volume
          persistentVolumeClaim:
            claimName: temp-data
