  redir: "root://eosproject-f.cern.ch/"
  out_path: "/mnt/collide2vchallenges/C9_robust_tagging"   # collide2vchallenges PVC mount, see fastmlhackathon/nrp/pvc.yaml
  dataset_version: collide2v_v1.0

  # TODO: real process list + per-process target_events + explicit labels.
  samples: []

  # TODO: which collections this tagging challenge needs (likely
  # L1T_JetAK4/JetPuppiAK4 at minimum for a jet-tagging task).
  collections: {}

  split:
    train_frac: 0.9
    eval_frac: 0.1
    seed: 42

  flush_every_events: 2000000
  report_diagnostics: false
